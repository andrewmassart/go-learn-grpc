syntax = "proto3";

package catalog;

option go_package = "github.com/andrewmassart/go-learn-grpc/catalog";

service CatalogService {
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
}

message GetProductRequest {
  string sku = 1;
}

message GetProductResponse {
  Product product = 1;
}

message Product {
  string sku = 1;
  string name = 2;
  int64 price_cents = 3;
}